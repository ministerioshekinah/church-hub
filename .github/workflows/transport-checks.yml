name: Public TLS Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/live-transport.cjs'
      - '.github/workflows/transport-checks.yml'

permissions:
  contents: read

jobs:
  public-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate public certificates and protocol negotiation
        run: node tests/live-transport.cjs
