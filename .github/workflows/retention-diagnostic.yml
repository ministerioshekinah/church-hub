name: Retained Browser Node Observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/browser-retention-diagnostic.cjs'
      - '.github/workflows/retention-diagnostic.yml'

permissions:
  contents: read

jobs:
  retained-node-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compare newsletter interactions with a minimal native search input
        run: node tests/browser-retention-diagnostic.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: retention-observation
          path: security/local-results/retention-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
