name: Extended Website Stability

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  two-hour-session:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[extended-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Keep two isolated visitor sessions under observation for two hours
        run: node tests/browser-endurance.cjs
        env:
          ENDURANCE_MINUTES: '120'
