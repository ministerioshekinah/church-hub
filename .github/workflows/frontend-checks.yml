name: Frontend and Security Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check browser JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Audit pinned browser and Edge Function dependencies
        run: npm audit --prefix security/runtime-dependencies --audit-level=high
