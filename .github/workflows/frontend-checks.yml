name: Frontend and Security Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check browser JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Audit pinned browser and Edge Function dependencies
        run: npm audit --prefix tooling/runtime-dependencies --audit-level=high
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise public and admin journeys with an isolated backend
        run: npm run test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          BROWSER_SCREENSHOT_DIR: test-results/previews
      - name: Verify the extended-session harness
        if: matrix.browser == 'chromium'
        run: node tests/browser-endurance.cjs
        env:
          ENDURANCE_MINUTES: '0.1'
      - name: Retain isolated browser results and visual previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
