name: Retained Browser Node Observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/browser-retention-diagnostic.cjs'
      - '.github/workflows/retention-diagnostic.yml'

permissions:
  contents: read

jobs:
  retained-node-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compare newsletter interactions with a minimal native search input
        run: node tests/browser-retention-diagnostic.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retention-observation
          path: test-results/retention-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
