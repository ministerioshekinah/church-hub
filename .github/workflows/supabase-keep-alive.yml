name: Supabase Keep Alive

on:
  schedule:
    # A few lightweight database requests each day help prevent Supabase
    # Free projects from being classified as inactive. Times are UTC.
    - cron: "17 6 * * *"
    - cron: "37 14 * * *"
    - cron: "53 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query the public service settings row
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 20 \
            "https://nhzxlsjwsvyimozubbho.supabase.co/rest/v1/service_settings?select=id&id=eq.1&limit=1" \
            -H "apikey: sb_publishable_afp59GoL5-3i0t_0h-0NwQ_Pl3FmZtT" \
            -H "Accept: application/json"

          echo
          echo "Supabase keep-alive query completed successfully."

  repository-heartbeat:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # GitHub can automatically disable scheduled workflows in public repos
      # after 60 days without repository activity. On the 1st and 15th of each
      # month this workflow records a tiny heartbeat commit so the scheduler
      # itself does not go dormant if the site code is otherwise unchanged.
      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          day="$(date -u +%d)"
          if [[ "$day" != "01" && "$day" != "15" ]]; then
            echo "No repository heartbeat needed today."
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          mkdir -p .github/keep-alive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keep-alive/last-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive/last-run.txt

          if git diff --cached --quiet; then
            echo "Heartbeat file is already current."
            exit 0
          fi

          git commit -m "chore: refresh workflow heartbeat"
          git push origin HEAD:main
