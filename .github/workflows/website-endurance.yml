name: Extended Website Stability

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  two-hour-session:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[extended-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Keep two isolated visitor sessions under observation for two hours
        run: node tests/browser-endurance.cjs
        env:
          ENDURANCE_MINUTES: '120'
