name: Public TLS Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/live-transport.cjs'
      - '.github/workflows/transport-checks.yml'

permissions:
  contents: read

jobs:
  public-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate public certificates and protocol negotiation
        run: node tests/live-transport.cjs
